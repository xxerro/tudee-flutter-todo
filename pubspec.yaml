name: tudee
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: cherrybomb
      fonts:
        - asset: fonts/CherryBombOne-Regular.ttf
